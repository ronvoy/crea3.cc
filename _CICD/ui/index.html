<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CREA3 CI/CD</title>
<style>
  :root { --bg:#0b1020; --panel:#111a2e; --panel2:#0e1526; --border:#223052; --text:#e6edf7; --muted:#8ea0bf; --accent:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; }
  * { box-sizing:border-box; min-width:0 }
  html, body { overflow-x:hidden; max-width:100% }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif }
  header { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--border); background:var(--panel2); flex-wrap:wrap }
  header h1 { font-size:14px; margin:0 }
  header .sub { color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1 1 120px }
  /* One column, one section per row — never side by side. */
  main { padding:10px; display:block }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:0; margin:0 0 10px }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0; padding:10px 12px 0 }
  .card > details > summary { cursor:pointer; list-style:none; padding:10px 12px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text); display:flex; align-items:center; gap:8px; flex-wrap:wrap }
  .card > details > summary::-webkit-details-marker { display:none }
  .card > details > summary::before { content:'▸'; color:var(--accent); font-size:11px }
  .card > details[open] > summary::before { content:'▾' }
  .card > details[open] > summary { border-bottom:1px solid var(--border) }
  .card > details > .body { padding:10px 12px 12px }
  .sum { font-weight:400; text-transform:none; letter-spacing:0; color:var(--muted); font-size:11px }
  /* Controls: stack on their own rows, full width, no overflow. */
  .stack { display:flex; flex-direction:column; gap:6px; margin-bottom:8px }
  .btns { display:flex; gap:6px; flex-wrap:wrap }
  .btns > button { flex:1 1 150px }
  .opts { display:flex; flex-direction:column; gap:4px; margin-top:6px }
  .opts label { display:flex; align-items:center; gap:6px }
  button { background:var(--accent); color:#fff; border:0; border-radius:7px; padding:7px 10px; cursor:pointer; font:inherit; font-weight:600 }
  button.ghost { background:transparent; border:1px solid var(--border); color:var(--text); font-weight:500 }
  button.ok { background:var(--ok); color:#06210f } button:disabled { opacity:.45; cursor:not-allowed }
  select, input { width:100%; background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:7px; padding:7px 9px; font:inherit }
  .strip { display:flex; flex-direction:column; gap:4px }
  .strip .kv { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap }
  .strip .k { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; flex:0 0 110px }
  .strip .v { font-weight:600; word-break:break-word; flex:1 1 auto }
  .scroll { overflow:auto; -webkit-overflow-scrolling:touch }
  table { width:100%; border-collapse:collapse; font-size:12px }
  th, td { text-align:left; padding:5px 6px; border-bottom:1px solid var(--border); vertical-align:top; word-break:break-word }
  th { color:var(--muted); font-weight:600; font-size:10px; text-transform:uppercase; letter-spacing:.05em; position:sticky; top:0; background:var(--panel); z-index:1 }
  td.nowrap { white-space:nowrap }
  tr.click { cursor:pointer } tr.click:hover td { background:#16213a }
  .badge { display:inline-block; font-size:10px; padding:0 7px; border-radius:999px; border:1px solid var(--border); color:var(--muted) }
  .badge.ok { color:var(--ok); border-color:var(--ok) } .badge.bad { color:var(--bad); border-color:var(--bad) } .badge.warn { color:var(--warn); border-color:var(--warn) } .badge.run { color:var(--accent); border-color:var(--accent) }
  pre#log { background:#05080f; color:#cfe1ff; border:1px solid var(--border); border-radius:8px; padding:10px; margin:8px 0 0; max-height:240px; overflow:auto; font-size:11px; line-height:1.4; white-space:pre-wrap; word-break:break-word }
  .sha { font-family:ui-monospace,Menlo,monospace; color:#9cc4ff }
  .muted { color:var(--muted) } .small { font-size:11px } .err { color:var(--bad) } .dirty { color:var(--warn) }
  code { background:var(--panel2); padding:0 4px; border-radius:4px }
  #toast { position:fixed; left:10px; right:10px; bottom:10px; background:#1f2937; border:1px solid var(--border); padding:9px 12px; border-radius:8px; display:none }
  /* Wider screens: the controls may sit on one line; sections stay stacked. */
  @media (min-width: 720px) {
    main { padding:12px 14px }
    .stack { flex-direction:row; align-items:center }
    .stack > select, .stack > input { flex:1 1 auto }
    .btns > button { flex:0 0 auto }
    .opts { flex-direction:row; gap:14px; flex-wrap:wrap }
    .strip .kv { flex-wrap:nowrap }
    #toast { left:auto; right:14px; max-width:420px }
  }
</style>
</head>
<body>
<header>
  <h1>CREA3 · CI/CD console</h1>
  <span class="sub" id="repoLine">…</span>
  <span style="flex:1"></span>
  <span id="runningBadge"></span>
  <button class="ghost" onclick="refreshAll()">⟳ Refresh</button>
  <button class="ghost" onclick="signOut()" title="Forget the token in this browser">Sign out</button>
</header>

<main>
  <section class="card" id="tokenCard" style="display:none">
    <h2>Token required</h2>
    <div class="stack"><input id="tokenInput" placeholder="CICD_TOKEN (see _CICD/.env or ./run_cicd.sh --url)"><button onclick="saveToken()">Use token</button></div>
  </section>

  <section class="card">
    <details open data-sec="checkout">
      <summary>Checkout <span class="sum" id="sumCheckout"></span></summary>
      <div class="body"><div class="strip" id="statusGrid"></div></div>
    </details>
  </section>

  <section class="card">
    <details open data-sec="actions">
      <summary>Actions</summary>
      <div class="body">
        <div class="stack">
          <select id="branchSel" title="branch to pull / deploy"></select>
          <div class="btns">
            <button class="ghost" onclick="loadBranches()" title="git fetch origin --prune">⟳ Fetch</button>
            <button onclick="pullBranch()" title="stash local changes, fetch, checkout, pull --ff-only">⬇ Pull</button>
            <button class="ok" onclick="deploy()" title="pull the selected branch, then restart the selected targets">▶ Pull &amp; deploy</button>
          </div>
        </div>
        <div class="stack">
          <input id="refInput" placeholder="branch / commit to checkout">
          <div class="btns"><button class="ghost" onclick="checkoutRef()">Checkout</button></div>
        </div>
        <div class="btns">
          <button class="ghost" onclick="act('/pull','Pull the current branch from origin? Local changes are added and stashed first.')">⬇ Remote pull</button>
          <button class="ghost" onclick="restart('_CREA3x')">↻ Restart platform</button>
          <button class="ghost" onclick="restart('_CREA3-Chatbot')">↻ Restart chatbot</button>
          <button class="ghost" onclick="act('/stash/push','Stash local changes now?')">Stash changes</button>
        </div>
        <div class="opts small muted">
          <label><input type="checkbox" id="tPlatform" checked> deploy target: platform</label>
          <label><input type="checkbox" id="tChatbot"> deploy target: chatbot</label>
          <label><input type="checkbox" id="autoSync" onchange="toggleAutoSync(this.checked)"> auto-sync every <span id="autoSyncInterval">10</span> s</label>
        </div>
        <div id="autoSyncLine" class="small muted"></div>
        <div id="autoDeploy" class="small muted"></div>
      </div>
    </details>
  </section>

  <section class="card">
    <details open data-sec="commits">
      <summary>Commits <span class="sum" id="commitsRef"></span></summary>
      <div class="body scroll" style="max-height:300px"><table id="commits"><thead><tr><th>Commit</th><th>Subject</th><th>Author</th><th>Date</th></tr></thead><tbody></tbody></table></div>
    </details>
  </section>

  <section class="card">
    <details data-sec="stashes">
      <summary>Stashes <span class="sum" id="stashCount"></span></summary>
      <div class="body scroll" style="max-height:240px"><table id="stashes"><thead><tr><th>Ref</th><th>Message</th><th>Date</th><th></th></tr></thead><tbody></tbody></table></div>
    </details>
  </section>

  <section class="card">
    <details data-sec="containers">
      <summary>Containers <span class="sum" id="containerCount"></span></summary>
      <div class="body scroll" style="max-height:240px"><table id="containers"><thead><tr><th>Name</th><th>Image</th><th>Status</th></tr></thead><tbody></tbody></table></div>
    </details>
  </section>

  <section class="card">
    <details open data-sec="jobs">
      <summary>Jobs <span class="sum" id="jobTitle"></span></summary>
      <div class="body">
        <div class="scroll" style="max-height:140px"><table id="jobs"><thead><tr><th>When</th><th>Job</th><th>By</th><th>Status</th></tr></thead><tbody></tbody></table></div>
        <pre id="log">— select a job or start an action —</pre>
      </div>
    </details>
  </section>
</main>
<div id="toast"></div>

<script>
const LS = 'crea3-cicd-token';
let token = new URLSearchParams(location.search).get('token') || localStorage.getItem(LS) || '';
if (token) { localStorage.setItem(LS, token); if (location.search.includes('token=')) history.replaceState({}, '', location.pathname); }
let status = null, branches = [], following = null, logLen = 0, pollTimer = null;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when = (iso) => iso ? new Date(iso).toLocaleString() : '—';
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; t.style.borderColor = bad ? 'var(--bad)' : 'var(--border)'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 4000); }
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'X-CICD-Token': token, ...(opts.headers || {}) } });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) { $('#tokenCard').style.display = ''; throw new Error('bad token'); }
  if (!r.ok) throw new Error(data.error || `${r.status}`);
  return data;
}
function saveToken() { token = $('#tokenInput').value.trim(); localStorage.setItem(LS, token); $('#tokenCard').style.display = 'none'; refreshAll(); }
function signOut() { localStorage.removeItem(LS); token = ''; $('#tokenCard').style.display = ''; }

function badge(st) { const cls = st === 'done' ? 'ok' : st === 'failed' ? 'bad' : st === 'unhealthy' ? 'warn' : 'run'; return `<span class="badge ${cls}">${esc(st)}</span>`; }

async function loadStatus() {
  status = await api('/api/status');
  const r = status.repo || {};
  $('#repoLine').textContent = r.ok ? `${r.repo} · ${r.remote}` : (r.error || '');
  $('#runningBadge').innerHTML = status.running ? `<span class="badge run">running: ${esc(status.running.title)}</span>` : '';
  const ab = r.ahead == null ? '—' : `${r.ahead} ahead · ${r.behind} behind origin`;
  $('#stashCount').textContent = `(${(status.stashes || []).length})`;
  $('#containerCount').textContent = `(${(status.containers || []).length})`;
  $('#statusGrid').innerHTML = [
    ['Branch', r.detached ? `<span class="warn">detached HEAD</span>` : esc(r.branch)],
    ['HEAD', `<span class="sha">${esc(r.head)}</span>`],
    ['Last commit', `${esc(r.subject)}<div class="muted small">${esc(r.author)} · ${when(r.committed_at)}</div>`],
    ['vs origin', r.behind > 0 ? `<span class="dirty">${ab}</span>` : ab],
    ['Local changes', r.dirty_count ? `<span class="dirty">${r.dirty_count} file(s)</span>` : 'clean'],
    ['Console uptime', `${Math.round(status.uptime_s / 60)} min`],
  ].map(([k, v]) => `<span class="kv"><span class="k">${k}</span><span class="v">${v}</span></span>`).join('');
  $('#sumCheckout').textContent = r.ok ? `${r.branch}${r.behind > 0 ? ` · ${r.behind} behind` : ''}${r.dirty_count ? ` · ${r.dirty_count} local change${r.dirty_count > 1 ? 's' : ''}` : ''}` : '';
  $('#stashes tbody').innerHTML = (status.stashes || []).map((s) => `<tr><td class="sha">${esc(s.ref)}</td><td>${esc(s.subject)}</td><td>${when(s.date)}</td><td><button class="ghost" onclick="act('/stash/pop/${s.index}','Pop ${esc(s.ref)} onto the working tree?')">pop</button> <button class="ghost" onclick="act('/stash/drop/${s.index}','Drop ${esc(s.ref)} permanently?')">drop</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">none</td></tr>';
  $('#containers tbody').innerHTML = (status.containers || []).map((c) => `<tr><td><b>${esc(c.name)}</b></td><td class="muted">${esc(c.image)}</td><td class="${c.state === 'running' ? '' : 'err'}">${esc(c.status)}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">none</td></tr>';
  const as = status.auto_sync || {};
  $('#autoSync').checked = !!as.enabled; $('#autoSyncInterval').textContent = as.interval || 10;
  $('#autoSyncLine').textContent = as.enabled ? `auto-sync ON · ${as.branch ? 'tracking origin/' + as.branch : ''} · last check ${as.last_check ? when(as.last_check) : '—'} · ${as.last_result || ''} · ${as.pulls || 0} pull(s) this session` : 'auto-sync OFF';
  const ad = status.auto_deploy || {};
  $('#autoDeploy').textContent = ad.webhook ? `GitHub webhook active: pushes to "${ad.branch || '(none)'}" auto-deploy ${ad.targets.join(', ')}` : 'GitHub webhook not configured (CICD_WEBHOOK_SECRET / CICD_AUTO_DEPLOY_BRANCH in _CICD/.env).';
  if (!$('#branchSel').options.length && r.branch && !r.detached) { $('#branchSel').innerHTML = `<option value="${esc(r.branch)}">${esc(r.branch)} (current)</option>`; }
  if (status.running && !following) follow(status.running.id);
}
async function loadBranches() {
  const b = await api('/api/branches');
  if (b.error) toast(b.error, true);
  branches = b.branches || [];
  const cur = $('#branchSel').value || b.current;
  $('#branchSel').innerHTML = branches.map((x) => `<option value="${esc(x.name)}" ${x.name === cur ? 'selected' : ''}>${esc(x.name)}${x.current ? ' (current)' : ''} — ${esc(x.head)} · ${esc(x.subject).slice(0, 48)}</option>`).join('');
  loadCommits();
}
async function loadCommits() {
  const ref = $('#branchSel').value || (status?.repo?.branch) || 'HEAD';
  const c = await api(`/api/commits?ref=${encodeURIComponent(ref)}&limit=60`);
  $('#commitsRef').textContent = c.ref ? `(${c.ref})` : '';
  $('#commits tbody').innerHTML = (c.commits || []).map((k) => `<tr class="click" title="checkout ${k.short}" onclick="checkoutSha('${k.sha}','${esc(k.short)}')"><td class="sha nowrap">${k.is_head ? '● ' : ''}${esc(k.short)}</td><td>${esc(k.subject)} ${k.refs.length ? `<span class="badge">${esc(k.refs.join(', '))}</span>` : ''}</td><td class="muted nowrap">${esc(k.author)}</td><td class="muted small nowrap">${when(k.date)}</td></tr>`).join('') || `<tr><td colspan="4" class="err">${esc(c.error || 'no commits')}</td></tr>`;
}
async function loadJobs() {
  const j = await api('/api/jobs');
  $('#jobs tbody').innerHTML = (j.jobs || []).slice(0, 12).map((x) => `<tr class="click" onclick="follow('${x.id}')"><td class="muted small nowrap">${when(x.created_at)}</td><td>${esc(x.title)}</td><td class="muted">${esc(x.by)}</td><td>${badge(x.status)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">none yet</td></tr>';
}
async function refreshAll() { try { await loadStatus(); await loadJobs(); if (!branches.length) await loadBranches(); else await loadCommits(); } catch (e) { toast(e.message, true); } }

// ── actions ──────────────────────────────────────────────────────────────────
function targets() { return [$('#tPlatform').checked && '_CREA3x', $('#tChatbot').checked && '_CREA3-Chatbot'].filter(Boolean); }
async function act(path, confirmMsg, body) {
  if (confirmMsg && !confirm(confirmMsg)) return;
  try { const job = await api(path, { method: 'POST', body: JSON.stringify(body || {}) }); toast(`started: ${job.title}`); follow(job.id); }
  catch (e) { toast(e.message, true); }
}
function pullBranch() { const b = $('#branchSel').value; if (b) act(`/pull/${encodeURIComponent(b)}`, `Pull "${b}"? Local changes are stashed first.`); }
function checkoutRef() { const r = $('#refInput').value.trim(); if (r) act(`/checkout/${encodeURIComponent(r)}`, `Checkout "${r}"? Local changes are stashed first.`); }
function checkoutSha(sha, short) { act(`/checkout/${sha}`, `Checkout commit ${short} (detached HEAD)? Local changes are stashed first.`); }
function restart(t) { act(`/restart/${t}`, `Restart ${t} now? The service is unavailable for about a minute.`); }
function deploy() { const b = $('#branchSel').value, t = targets(); if (!b || !t.length) return toast('choose a branch and at least one target', true); act('/deploy', `Deploy "${b}" → ${t.join(' + ')}?\nPull (auto-stash), then restart the targets.`, { branch: b, targets: t, pull: true }); }

async function toggleAutoSync(on) { try { await api('/api/autosync', { method: 'POST', body: JSON.stringify({ enabled: on }) }); toast(`auto-sync ${on ? 'enabled' : 'disabled'}`); loadStatus(); } catch (e) { toast(e.message, true); } }

// Remember which sections are open.
document.querySelectorAll('details[data-sec]').forEach((d) => {
  const key = 'crea3-cicd-sec-' + d.dataset.sec;
  try { const v = localStorage.getItem(key); if (v !== null) d.open = v === '1'; } catch (e) {}
  d.addEventListener('toggle', () => { try { localStorage.setItem(key, d.open ? '1' : '0'); } catch (e) {} });
});
const openSection = (name) => { const d = document.querySelector(`details[data-sec="${name}"]`); if (d && !d.open) d.open = true; };

// ── job follow ───────────────────────────────────────────────────────────────
function follow(id) {
  following = id; logLen = 0; $('#log').textContent = '…'; clearInterval(pollTimer); openSection('jobs');
  const tick = async () => {
    try {
      const j = await api(`/api/jobs/${id}?offset=${logLen}`);
      $('#jobTitle').innerHTML = `${esc(j.title)} ${badge(j.status)} <span class="muted">${esc(j.by || '')}</span>`;
      if (j.log.length) { if (logLen === 0) $('#log').textContent = ''; $('#log').textContent += j.log.join('\n') + '\n'; logLen = j.log_len; $('#log').scrollTop = $('#log').scrollHeight; }
      if (['done', 'failed', 'unhealthy'].includes(j.status)) { clearInterval(pollTimer); following = null; refreshAll(); }
    } catch (e) { /* the console itself keeps running; transient errors are ignored */ }
  };
  tick(); pollTimer = setInterval(tick, 1500);
}

if (!token) $('#tokenCard').style.display = '';
refreshAll();
setInterval(() => { if (!following) loadStatus().catch(() => {}); }, 15000);
</script>
</body>
</html>
