</g>
<g class="b02-wL">
<line x1="96" y1="226" x2="96" y2="246" stroke="#1F2933" stroke-width="1.5"/>
<circle cx="96" cy="262" r="32" fill="#D85A30" opacity=".16"/>
<circle cx="96" cy="262" r="32" fill="none" stroke="#D85A30" stroke-width="1.25" stroke-dasharray="4 3" opacity=".7"/>
<path d="M87,256 L96,246 L105,256 V273 Q105,277 101,277 H91 Q87,277 87,273 Z" fill="url(#b02-gInk)"/><circle cx="96" cy="257" r="2.2" fill="#FFFFFF"/>
</g>
<g class="b02-wR">
<line x1="584" y1="226" x2="584" y2="246" stroke="#1F2933" stroke-width="1.5"/>
<circle cx="584" cy="262" r="18" fill="#1D9E75" opacity=".16"/>
<circle cx="584" cy="262" r="18" fill="none" stroke="#1D9E75" stroke-width="1.25" stroke-dasharray="4 3" opacity=".7"/>
<path d="M575,256 L584,246 L593,256 V273 Q593,277 589,277 H579 Q575,277 575,273 Z" fill="url(#b02-gInk)"/><circle cx="584" cy="257" r="2.2" fill="#FFFFFF"/>
</g>
<circle class="b02-ring" cx="340" cy="212" r="9" fill="none" stroke="#E9A825" stroke-width="2" opacity="0"/>
</svg>
