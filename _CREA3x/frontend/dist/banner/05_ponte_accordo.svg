<svg width="100%" viewBox="0 0 680 506" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Accordo raggiunto</title>
<desc>Le parti costruiscono insieme il collegamento mancante, fino a un'intesa condivisa e duratura.</desc>
<rect x="0" y="0" width="680" height="506" fill="#FAFAF7"/>
<text x="340.0" y="50" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600" fill="#2C2C2A">Accordo raggiunto</text>
<text x="340.0" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5F5E5A">Le parti costruiscono insieme il collegamento mancante, fino a un'intesa condivisa e duratura.</text>
<svg x="0" y="86" width="680" height="400" viewBox="0 0 680 400">

<defs>
<linearGradient id="b05-duskB" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#241B4D"/>
<stop offset="0.55" stop-color="#7C3E7E"/>
<stop offset="0.82" stop-color="#D85A30"/>
<stop offset="1" stop-color="#FAC775"/>
</linearGradient>
<radialGradient id="b05-coreGlow" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#FFFDF2" stop-opacity="1"/>
<stop offset="0.4" stop-color="#FAC775" stop-opacity="0.85"/>
<stop offset="1" stop-color="#FAC775" stop-opacity="0"/>
</radialGradient>
<linearGradient id="b05-cableL" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#5DCAA5"/>
<stop offset="1" stop-color="#FFFDF2"/>
</linearGradient>
<linearGradient id="b05-cableR" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#FFFDF2"/>
<stop offset="1" stop-color="#F0997B"/>
</linearGradient>
</defs>

<style>
.b05-riseL{stroke-dasharray:420;animation:b05-riseLAnim 6s cubic-bezier(0.45,0,0.55,1) infinite}
.b05-riseR{stroke-dasharray:420;animation:b05-riseRAnim 6s cubic-bezier(0.45,0,0.55,1) infinite}
.b05-deck{animation:b05-deckAnim 6s cubic-bezier(0.45,0,0.55,1) infinite;transform-origin:340px 220px}
.b05-core{animation:b05-coreAnim 6s cubic-bezier(0.45,0,0.55,1) infinite}
.b05-glint{animation:b05-glintAnim 6s ease-out infinite}
.b05-glint2{animation:b05-glintAnim 6s ease-out infinite 0.2s}
.b05-reflect{animation:b05-reflectAnim 6s cubic-bezier(0.45,0,0.55,1) infinite}
.b05-shard{animation:b05-shardAnim 6s cubic-bezier(0.45,0,0.55,1) infinite;transform-origin:340px 205px}
@keyframes b05-riseLAnim{0%,10%{stroke-dashoffset:420}45%,70%{stroke-dashoffset:0}90%,100%{stroke-dashoffset:420}}
@keyframes b05-riseRAnim{0%,10%{stroke-dashoffset:-420}45%,70%{stroke-dashoffset:0}90%,100%{stroke-dashoffset:-420}}
@keyframes b05-deckAnim{0%,42%{opacity:0;transform:scaleX(0.05)}58%,75%{opacity:1;transform:scaleX(1)}90%,100%{opacity:0;transform:scaleX(0.05)}}
@keyframes b05-coreAnim{0%,40%{opacity:0;transform:scale(0.3)}55%{opacity:1;transform:scale(1.2)}72%,85%{opacity:0.7;transform:scale(1)}100%{opacity:0;transform:scale(0.3)}}
@keyframes b05-glintAnim{0%,50%{opacity:0;transform:translateY(0)}62%{opacity:1}80%{opacity:0;transform:translateY(-30px)}100%{opacity:0}}
@keyframes b05-reflectAnim{0%,45%{opacity:0}58%,80%{opacity:0.35}100%{opacity:0}}
@keyframes b05-shardAnim{0%,8%{opacity:0;transform:translate(var(--sx),var(--sy)) rotate(var(--sr)) scale(0.4)}45%,62%{opacity:0.85;transform:translate(0,0) rotate(0deg) scale(1)}90%,100%{opacity:0;transform:translate(var(--sx),var(--sy)) rotate(var(--sr)) scale(0.4)}}
</style>

<rect x="0" y="0" width="680" height="400" fill="url(#b05-duskB)"/>

<!-- stars -->
<circle cx="90" cy="40" r="1.4" fill="#FFF6DE" opacity="0.7"/>
<circle cx="560" cy="35" r="1.3" fill="#FFF6DE" opacity="0.7"/>
<circle cx="620" cy="70" r="1.1" fill="#FFF6DE" opacity="0.5"/>
<circle cx="40" cy="90" r="1.1" fill="#FFF6DE" opacity="0.5"/>

<!-- water below -->
<rect x="0" y="330" width="680" height="70" fill="#1A1440" opacity="0.9"/>
<rect x="240" y="330" width="200" height="70" fill="url(#b05-coreGlow)" opacity="0.25" class="b05-reflect"/>

<!-- cliffs -->
<polygon points="0,400 0,240 130,270 165,330 0,330" fill="#170F38"/>
<polygon points="680,400 680,240 550,270 515,330 680,330" fill="#170F38"/>
<polygon points="0,330 0,240 130,270 150,300 20,300" fill="#241B4D"/>
<polygon points="680,330 680,240 550,270 530,300 660,300" fill="#241B4D"/>

<!-- fragments of light assembling into a seal/ring behind the bridge: the "seal" of the agreement taking shape -->
<g fill="#FFFDF2">
<path class="b05-shard" d="M340,95 L346,108 L334,108 Z" style="--sx:-70px;--sy:-90px;--sr:140deg"/>
<path class="b05-shard" d="M383,104 L390,116 L378,118 Z" style="--sx:60px;--sy:-95px;--sr:-120deg"/>
<path class="b05-shard" d="M420,127 L426,140 L414,140 Z" style="--sx:100px;--sy:-40px;--sr:100deg"/>
<path class="b05-shard" d="M444,160 L452,170 L440,174 Z" style="--sx:120px;--sy:20px;--sr:-90deg"/>
<path class="b05-shard" d="M452,200 L462,206 L452,212 Z" style="--sx:110px;--sy:80px;--sr:130deg"/>
<path class="b05-shard" d="M444,240 L452,250 L438,248 Z" style="--sx:80px;--sy:110px;--sr:-100deg"/>
<path class="b05-shard" d="M420,273 L430,282 L416,284 Z" style="--sx:30px;--sy:120px;--sr:110deg"/>
<path class="b05-shard" d="M383,296 L392,306 L378,304 Z" style="--sx:-30px;--sy:120px;--sr:-130deg"/>
<path class="b05-shard" d="M340,305 L346,316 L332,316 Z" style="--sx:-80px;--sy:110px;--sr:120deg"/>
<path class="b05-shard" d="M297,296 L306,304 L292,306 Z" style="--sx:-120px;--sy:70px;--sr:-110deg"/>
<path class="b05-shard" d="M260,273 L270,284 L256,282 Z" style="--sx:-130px;--sy:10px;--sr:100deg"/>
<path class="b05-shard" d="M236,240 L248,248 L234,250 Z" style="--sx:-110px;--sy:-50px;--sr:-120deg"/>
<path class="b05-shard" d="M228,200 L238,206 L228,212 Z" style="--sx:-90px;--sy:-100px;--sr:140deg"/>
<path class="b05-shard" d="M236,160 L248,170 L236,174 Z" style="--sx:-40px;--sy:-120px;--sr:-100deg"/>
<path class="b05-shard" d="M260,127 L270,140 L256,140 Z" style="--sx:20px;--sy:-110px;--sr:110deg"/>
<path class="b05-shard" d="M297,104 L306,116 L292,118 Z" style="--sx:70px;--sy:-70px;--sr:-140deg"/>
</g>

<!-- two cable-arcs of light rising from each cliff toward the centre -->
<path class="b05-riseL" d="M100,255 C190,190 260,175 320,205" fill="none" stroke="url(#b05-cableL)" stroke-width="6" stroke-linecap="round"/>
<path class="b05-riseR" d="M580,255 C490,190 420,175 360,205" fill="none" stroke="url(#b05-cableR)" stroke-width="6" stroke-linecap="round"/>

<!-- the deck of light materialising where the two arcs meet -->
<g class="b05-deck">
<rect x="300" y="212" width="80" height="10" rx="5" fill="#FFFDF2"/>
</g>

<!-- radiant core where the bridge completes -->
<circle cx="340" cy="205" r="70" fill="url(#b05-coreGlow)" class="b05-core"/>

<!-- rising glints of light along the finished span -->
<circle cx="325" cy="215" r="2.5" fill="#FFFDF2" class="b05-glint"/>
<circle cx="355" cy="215" r="2.5" fill="#FFFDF2" class="b05-glint2"/>

<!-- suspender lines linking cable to deck -->
<line x1="230" y1="195" x2="240" y2="215" stroke="#FFFDF2" stroke-width="2" opacity="0.5"/>
<line x1="280" y1="200" x2="285" y2="216" stroke="#FFFDF2" stroke-width="2" opacity="0.5"/>
<line x1="450" y1="195" x2="440" y2="215" stroke="#FFFDF2" stroke-width="2" opacity="0.5"/>
<line x1="400" y1="200" x2="395" y2="216" stroke="#FFFDF2" stroke-width="2" opacity="0.5"/>

</svg>
</svg>
