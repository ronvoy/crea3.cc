services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KC_DB_DATABASE:-keycloak}
      POSTGRES_USER: ${KC_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USER:-keycloak} -d ${KC_DB_DATABASE:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Admin bootstrap
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}

      # Database
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: ${KC_DB_DATABASE:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}

      # Quality-of-life
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_PROXY: ${KC_PROXY:-edge}
      # Optional for production (set to auth.yourdomain.com)
      KC_HOSTNAME: ${KC_HOSTNAME:-}

    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      # Mount the whole import folder (more reliable on Windows than single-file mounts)
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # Just checks the TCP port is open; init job will retry until fully ready
      test: ["CMD-SHELL", "bash -lc 'cat </dev/null >/dev/tcp/localhost/8080'"]
      interval: 5s
      timeout: 5s
      retries: 40

  # One-shot job that configures SMTP on the realm from env vars.
  # Re-run it any time you change SMTP_* in .env:
  #   docker compose up -d --force-recreate keycloak-init
  keycloak-init:
    image: quay.io/keycloak/keycloak:24.0.5
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

    # ✅ FORCE load the project's .env into this container
    env_file:
      - ./.env

    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-crea}

      # ✅ SMTP settings MUST come from .env (no silent defaults)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_STARTTLS: ${SMTP_STARTTLS}
      SMTP_SSL: ${SMTP_SSL}

    volumes:
      - ./scripts/keycloak:/scripts:ro
    entrypoint: ["/bin/bash", "-lc"]
    command: ["/scripts/apply-smtp.sh"]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Inbox UI

volumes:
  keycloak_db:
