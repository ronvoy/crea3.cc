<title id="b04-title">Tessere a incastro – le posizioni delle parti combaciano</title>
<desc id="b04-desc">An allocation where each share slots into place: six shares, alternating between the two parties, lock into one board; the mutual concessions (the tabs) light up gold.</desc>
