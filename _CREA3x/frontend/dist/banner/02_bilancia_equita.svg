<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 680 408" width="100%" role="img" aria-labelledby="b02-title b02-desc">
<title id="b02-title">L'algoritmo di equità – la bilancia dell'equità</title>
<desc id="b02-desc">Every party's perceived value is weighed, not just the price tag: identical price tags, different perceived values; the fulcrum leaves the forced 50/50 mark and finds the true balance point.</desc>
<defs>
<linearGradient id="b02-gInk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A4755"/><stop offset="1" stop-color="#1F2933"/></linearGradient>
<linearGradient id="b02-gInkH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B3641"/><stop offset=".5" stop-color="#3E4C59"/><stop offset="1" stop-color="#2B3641"/></linearGradient>
<linearGradient id="b02-gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2DB58C"/><stop offset="1" stop-color="#158A66"/></linearGradient>
<linearGradient id="b02-gOrange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9744A"/><stop offset="1" stop-color="#C64E27"/></linearGradient>
<radialGradient id="b02-gGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F6D387" stop-opacity=".95"/><stop offset=".45" stop-color="#F6D387" stop-opacity=".45"/><stop offset="1" stop-color="#F6D387" stop-opacity="0"/></radialGradient>
<filter id="b02-sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1F2933" flood-opacity=".16"/></filter>
<filter id="b02-blur" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
.b02-beam{transform-box:view-box;transform-origin:340px 222px;animation:b02-beam 7s cubic-bezier(0.65,0,0.35,1) infinite}
.b02-fulcrum{animation:b02-fulcrum 7s cubic-bezier(0.65,0,0.35,1) infinite}
.b02-bubble{animation:b02-bubble 7s cubic-bezier(0.65,0,0.35,1) infinite}
.b02-ghost{animation:b02-ghost 7s cubic-bezier(0.65,0,0.35,1) infinite}
.b02-ring{transform-box:view-box;transform-origin:340px 212px;animation:b02-ring 7s ease-out infinite}
.b02-wL{animation:b02-wL 7s cubic-bezier(0.65,0,0.35,1) infinite}
.b02-wR{animation:b02-wR 7s cubic-bezier(0.65,0,0.35,1) infinite}
@keyframes b02-wL{0%,10%{transform:translate(2.4px,34px)}45%,86%{transform:translate(0,0)}100%{transform:translate(2.4px,34px)}}
@keyframes b02-wR{0%,10%{transform:translate(-2.4px,-34px)}45%,86%{transform:translate(0,0)}100%{transform:translate(-2.4px,-34px)}}
@keyframes b02-beam{0%,10%{transform:rotate(-8deg)}45%,86%{transform:rotate(0deg)}100%{transform:rotate(-8deg)}}
@keyframes b02-fulcrum{0%,10%{transform:translateX(78px)}45%,86%{transform:translateX(0)}100%{transform:translateX(78px)}}
@keyframes b02-bubble{0%,10%{transform:translateX(7px);fill:#9AA5B1}45%,86%{transform:translateX(0);fill:#E9A825}100%{transform:translateX(7px);fill:#9AA5B1}}
@keyframes b02-ghost{0%,10%{opacity:0}45%,86%{opacity:1}100%{opacity:0}}
@keyframes b02-ring{0%,44%{opacity:0;transform:scale(1)}48%{opacity:.9;transform:scale(1.05)}64%,100%{opacity:0;transform:scale(3.2)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="680" height="408" fill="#FFFFFF"/>
<line x1="70" y1="352" x2="610" y2="352" stroke="#CBD2D9" stroke-width="1.5" stroke-linecap="round"/>
