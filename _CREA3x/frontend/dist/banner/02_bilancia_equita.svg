<circle cx="96" cy="222" r="4.5" fill="#1F2933"/>
<circle cx="584" cy="222" r="4.5" fill="#1F2933"/>
<rect x="328" y="209" width="24" height="7" rx="3.5" fill="#FFFFFF" stroke="#1F2933" stroke-width="1.25"/>
