<svg width="100%" viewBox="0 0 680 366" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="0" y="0" width="680" height="366" fill="#FAFAF7"/>
<svg x="0" y="86" width="680" height="260" viewBox="0 0 680 260">



<style>
.b02-beam{animation:b02-beamAnim 5s cubic-bezier(0.45,0,0.55,1) infinite}
.b02-pivot{animation:b02-pivotAnim 5s cubic-bezier(0.45,0,0.55,1) infinite}
.b02-ind{animation:b02-indAnim 5s steps(1,end) infinite}
@keyframes b02-beamAnim{
0%,15%{transform-origin:340px 190px;transform:rotate(-11deg)}
50%,65%{transform-origin:260px 190px;transform:rotate(0deg)}
100%{transform-origin:340px 190px;transform:rotate(-11deg)}
}
@keyframes b02-pivotAnim{
0%,15%{transform:translateX(0px)}
50%,65%{transform:translateX(-80px)}
100%{transform:translateX(0px)}
}
@keyframes b02-indAnim{
0%,15%{fill:#A32D2D}
50%,65%{fill:#3B6D11}
100%{fill:#A32D2D}
}
</style>
<line x1="60" y1="225" x2="620" y2="225" stroke="#5F5E5A" stroke-width="1"/>
<polygon class="b02-pivot" points="320,225 360,225 340,190" fill="#5F5E5A"/>
<g class="b02-beam">
<rect x="100" y="186" width="480" height="8" rx="4" fill="#2C2C2A"/>
<line x1="100" y1="190" x2="100" y2="235" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="580" y1="190" x2="580" y2="225" stroke="#5F5E5A" stroke-width="1.5"/>
<circle cx="100" cy="257" r="22" fill="#F0997B" stroke="#712B13" stroke-width="0.5"/>
<circle cx="580" cy="239" r="14" fill="#5DCAA5" stroke="#085041" stroke-width="0.5"/>
</g>
<circle class="b02-ind" cx="340" cy="145" r="7" fill="#A32D2D"/>

</svg>
</svg>
