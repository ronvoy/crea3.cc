<radialGradient id="b04-gGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F6D387" stop-opacity=".95"/><stop offset=".45" stop-color="#F6D387" stop-opacity=".45"/><stop offset="1" stop-color="#F6D387" stop-opacity="0"/></radialGradient>
