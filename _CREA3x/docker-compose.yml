# ============================================================================
# CREA3 — full stack (single public origin)
#
#   frontend (nginx)  serves the SPA AND proxies:  /api -> backend,
#                     /realms + /resources -> keycloak.
#   => The entire app (UI + API + auth) is reachable on ONE origin, so it works
#      on localhost and behind a SINGLE Cloudflare tunnel with no CORS setup.
#
#   backend  FastAPI (SQLite on a volume)          db  Postgres (for Keycloak)
#   keycloak auth (realm auto-import)              keycloak-init  one-shot config
#   mailpit  captures outgoing email (dev)
#
# Configure ./.env (copy from .env.example), then:
#   docker compose up -d --build
# App:            http://localhost:${FRONTEND_PORT:-3010}
# Keycloak admin: http://localhost:${KEYCLOAK_PORT:-8080}/admin
# Mail inbox:     http://localhost:8025
#
# To expose it later with ONE Cloudflare tunnel pointed at the frontend:
#   set APP_PUBLIC_URL=https://<your-domain> in .env, then
#   docker compose up -d --build           (rebuilds frontend, updates keycloak/backend)
# ============================================================================
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KC_DB_DATABASE:-keycloak}
      POSTGRES_USER: ${KC_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USER:-keycloak} -d ${KC_DB_DATABASE:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}

      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: ${KC_DB_DATABASE:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}

      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_PROXY: ${KC_PROXY:-edge}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      # No hardcoded hostname: Keycloak is proxied under the app origin (the
      # backend forwards X-Forwarded-Host/Proto), so it builds token issuers and
      # verification links for whatever origin the browser used — localhost:8000
      # OR any tunnel domain. Single port, no per-domain config needed.
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'cat </dev/null >/dev/tcp/localhost/8080'"]
      interval: 5s
      timeout: 5s
      retries: 40

  # One-shot: aligns the crea-backend client secret with the backend, enables
  # the frontend client's direct grants + origins, and applies SMTP — every run.
  keycloak-init:
    image: quay.io/keycloak/keycloak:24.0.5
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"
    env_file:
      - ./.env
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-crea}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3010}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-crea-frontend}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-crea-backend}
      # Same default as the backend, so the secret can never drift.
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-crea-backend-dev-secret-change-me}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_STARTTLS: ${SMTP_STARTTLS}
      SMTP_SSL: ${SMTP_SSL}
    volumes:
      - ./scripts/keycloak:/scripts:ro
    entrypoint: ["/bin/bash", "-lc"]
    command: ["bash /scripts/apply-config.sh"]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_started
    # Lets OLLAMA_BASE_URL=http://host.docker.internal:11434 reach an Ollama
    # server running on the host (works on Docker Desktop and Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: sqlite:////app/data/crea3.db

      # Public issuer origin (what the browser used to get the token).
      KEYCLOAK_URL: ${APP_PUBLIC_URL:-http://localhost:3010}
      # Server-to-server URL for JWKS + admin REST (container network).
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-crea}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-crea-frontend}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-crea-backend}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-crea-backend-dev-secret-change-me}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}

      # Same-origin via the frontend proxy, so CORS is not exercised; wildcard
      # is a harmless safety net (Bearer-token API, no cookies).
      CORS_ORIGINS: ${CORS_ORIGINS:-*}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_STARTTLS: ${SMTP_STARTTLS}
      SMTP_SSL: ${SMTP_SSL}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}

      PUBLIC_INVITE_LINK: ${APP_PUBLIC_URL:-http://localhost:3010}/app
      PUBLIC_REGISTER_LINK: ${APP_PUBLIC_URL:-http://localhost:3010}/register

      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      LEGAL_AI_URL: ${LEGAL_AI_URL:-}
    volumes:
      - crea_backend_data:/app/data
      - crea_reports:/app/generated_reports
      - crea_uploads:/app/uploaded_documents
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    # (1) Collega il backend sia agli altri servizi CREA3 (default) sia alla
    #     rete di Ollama, così può raggiungere il container per nome.
    networks:
      - default
      - ollama_net

  frontend:
    build:
      context: ./frontend
      args:
        # Single origin: relative /api (proxied) and Keycloak on this same origin.
        VITE_API_BASE: ""
        VITE_KEYCLOAK_URL: ${APP_PUBLIC_URL:-http://localhost:3010}
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-crea}
        VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-crea-frontend}
        VITE_KEYCLOAK_ACCOUNT_URL: ${APP_PUBLIC_URL:-http://localhost:3010}/realms/${KEYCLOAK_REALM:-crea}/account
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      keycloak:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-3010}:80"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Inbox UI

  # Deployer sidecar (admin panel → System → CI/CD): pulls the repo and rebuilds/
  # restarts the platform (./run_be.sh) and the chatbot. Talks to the host Docker
  # daemon through the socket; the repo is mounted at its HOST path so the bind
  # mounts run_be.sh issues resolve. Not published on the host — the backend
  # reaches it as http://deployer:9000 with DEPLOYER_TOKEN (both set by run_be.sh).
  deployer:
    build: ./infra/deployer
    restart: unless-stopped
    environment:
      DEPLOYER_TOKEN: ${DEPLOYER_TOKEN:-}
      HOST_REPO_DIR: ${HOST_REPO_DIR:-/repo}
      PLATFORM_HEALTH: http://crea3x-backend:8000/health
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_REPO_DIR:-..}:${HOST_REPO_DIR:-/repo}
      - ${HOME}/.ssh:/root/.ssh:ro          # deploy key for `git fetch origin` (SSH remote)
      - deployer_jobs:/var/lib/deployer

volumes:
  deployer_jobs:
  keycloak_db:
  crea_backend_data:
  crea_reports:
  crea_uploads:

# (2) La rete di Ollama, già esistente sul server, referenziata come esterna.
#     'name: api' = usa proprio quella rete chiamata "api" (niente prefisso).
networks:
  ollama_net:
    external: true
    name: api