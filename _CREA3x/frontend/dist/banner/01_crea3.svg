<svg width="100%" viewBox="0 0 680 506" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>CREA3</title>
<desc>Dal gioco delle parti a una soluzione condivisa e trasparente, con il cofinanziamento dell'Unione Europea.</desc>
<rect x="0" y="0" width="680" height="506" fill="#FAFAF7"/>
<text x="340.0" y="50" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600" fill="#2C2C2A">CREA3</text>
<text x="340.0" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5F5E5A">Dal gioco delle parti a una soluzione condivisa e trasparente.</text>
<svg x="0" y="86" width="680" height="400" viewBox="0 0 680 400">



<defs>
<radialGradient id="b01-bg" cx="50%" cy="35%" r="75%">
<stop offset="0" stop-color="#EEEDFE"/>
<stop offset="1" stop-color="#F4F2EC"/>
</radialGradient>
<radialGradient id="b01-glow" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#FAC775" stop-opacity="0.55"/>
<stop offset="1" stop-color="#FAC775" stop-opacity="0"/>
</radialGradient>
</defs>
<style>
.b01-beam{animation:b01-beamAnim 6s cubic-bezier(0.45,0,0.55,1) infinite;transform-origin:340px 150px}
.b01-glowPulse{animation:b01-glowAnim 6s cubic-bezier(0.45,0,0.55,1) infinite}
.b01-flowL{stroke-dasharray:8 6;animation:b01-flowAnim 2.4s linear infinite}
.b01-flowR{stroke-dasharray:8 6;animation:b01-flowAnimR 2.4s linear infinite}
.b01-nodeL{animation:b01-nodeInL 6s cubic-bezier(0.45,0,0.55,1) infinite}
.b01-nodeR{animation:b01-nodeInR 6s cubic-bezier(0.45,0,0.55,1) infinite}
@keyframes b01-beamAnim{0%,10%{transform:rotate(-7deg)}50%,70%{transform:rotate(0deg)}90%,100%{transform:rotate(-7deg)}}
@keyframes b01-glowAnim{0%,45%{opacity:0.2}55%,75%{opacity:1}100%{opacity:0.2}}
@keyframes b01-flowAnim{to{stroke-dashoffset:-28}}
@keyframes b01-flowAnimR{to{stroke-dashoffset:28}}
@keyframes b01-nodeInL{0%,10%{transform:translate(0,0)}50%,70%{transform:translate(14px,-4px)}90%,100%{transform:translate(0,0)}}
@keyframes b01-nodeInR{0%,10%{transform:translate(0,0)}50%,70%{transform:translate(-14px,-4px)}90%,100%{transform:translate(0,0)}}
</style>

<rect x="0" y="0" width="680" height="400" fill="url(#b01-bg)"/>

<circle cx="340" cy="185" r="90" fill="url(#b01-glow)" class="b01-glowPulse"/>

<path class="b01-flowL" d="M120,120 C210,140 270,150 300,158" fill="none" stroke="#1D9E75" stroke-width="2" opacity="0.55"/>
<path class="b01-flowL" d="M110,190 C200,185 265,170 300,163" fill="none" stroke="#1D9E75" stroke-width="2" opacity="0.55"/>
<path class="b01-flowL" d="M125,260 C210,230 265,190 300,168" fill="none" stroke="#1D9E75" stroke-width="2" opacity="0.55"/>

<path class="b01-flowR" d="M560,120 C470,140 410,150 380,158" fill="none" stroke="#D85A30" stroke-width="2" opacity="0.55"/>
<path class="b01-flowR" d="M570,190 C480,185 415,170 380,163" fill="none" stroke="#D85A30" stroke-width="2" opacity="0.55"/>
<path class="b01-flowR" d="M555,260 C470,230 415,190 380,168" fill="none" stroke="#D85A30" stroke-width="2" opacity="0.55"/>

<g class="b01-nodeL">
  <circle cx="120" cy="120" r="9" fill="#1D9E75"/>
  <circle cx="110" cy="190" r="12" fill="#0F6E56"/>
  <circle cx="125" cy="260" r="7" fill="#5DCAA5"/>
</g>

<g class="b01-nodeR">
  <circle cx="560" cy="120" r="9" fill="#D85A30"/>
  <circle cx="570" cy="190" r="12" fill="#993C1D"/>
  <circle cx="555" cy="260" r="7" fill="#F0997B"/>
</g>

<g class="b01-beam">
  <line x1="240" y1="158" x2="440" y2="158" stroke="#444441" stroke-width="4" stroke-linecap="round"/>
  <line x1="240" y1="158" x2="240" y2="176" stroke="#444441" stroke-width="3"/>
  <line x1="440" y1="158" x2="440" y2="176" stroke="#444441" stroke-width="3"/>
  <path d="M215,176 L265,176 L255,192 L225,192 Z" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1.5"/>
  <path d="M415,176 L465,176 L455,192 L425,192 Z" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1.5"/>
</g>

<path d="M325,150 L340,120 L355,150 Z" fill="#5F5E5A"/>
<path d="M320,340 L360,340 L346,155 L334,155 Z" fill="#888780"/>
<rect x="290" y="340" width="100" height="14" rx="4" fill="#5F5E5A"/>


</svg>
</svg>
